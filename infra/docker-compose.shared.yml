# Chạy CHUNG máy chủ với dự án khác đã dùng Caddy của máy (cổng 80/443). Khác docker-compose.prod.yml:
#   - Không có Caddy riêng, không công bố cổng ra Internet.
#   - Ứng dụng chỉ nghe ở 127.0.0.1:${ADH_HOST_PORT:-8081}; muốn mở ra ngoài thì thêm MỘT khối tên miền vào Caddy của máy (docs/RUNBOOK.md, mục B.2b).
#   - Dùng ảnh dựng sẵn từ GitHub (ghcr.io/nexagnet/adh-app:<thẻ>), không build trên máy chủ.
# Dùng qua infra/deploy.sh; không gọi trực tiếp trừ khi cần gỡ lỗi.
name: adh

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Hãy đặt DB_PASSWORD trong file .env}
    # Cấu hình nhỏ: máy 2 GB RAM còn phải chạy dự án khác.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [internal]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/nexagnet/adh-app:${ADH_TAG:-chua-dat}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/crm
      DB_USER: crm
      DB_PASSWORD: ${DB_PASSWORD:?Hãy đặt DB_PASSWORD trong file .env}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Hãy đặt APP_ADMIN_PASSWORD trong file .env}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://adh.invalid}
      APP_SHOP_NAME: ${APP_SHOP_NAME:-Cửa hàng}
      APP_SHOP_PHONE: ${APP_SHOP_PHONE:-}
      APP_SENDING_ENABLED: ${APP_SENDING_ENABLED:-false}
      # Thời tiết trên bản đồ (MET Norway). Mặc định TẮT; bật bằng APP_WEATHER_ENABLED=true trong file .env rồi chạy lại.
      APP_WEATHER_ENABLED: ${APP_WEATHER_ENABLED:-false}
      APP_WEATHER_USER_AGENT: ${APP_WEATHER_USER_AGENT:-adh-shop-crm/1.0}
      # Bộ nối Zalo không chính thức (D16): mặc định TẮT. Muốn bật cần cả cờ này, profile zalo-auto và chọn nấc ở trang quản trị.
      APP_ZALO_AUTO_ENABLED: ${APP_ZALO_AUTO_ENABLED:-false}
      APP_ZALO_BRIDGE_URL: http://zalo-bridge:3100
      APP_ZALO_BRIDGE_KEY: ${APP_ZALO_BRIDGE_KEY:-}
      APP_ZALO_AUTO_MAX_DAILY: ${APP_ZALO_AUTO_MAX_DAILY:-100}
      APP_ZALO_GROUP_DEPUTY_ID: ${ZALO_DEPUTY_ID:-}
      # Tự gửi tin (D18): trần cứng số tin/ngày mà trang quản trị được phép đặt. Công tắc mặc định TẮT.
      APP_ZALO_AUTO_MSG_MAX_DAILY: ${APP_ZALO_AUTO_MSG_MAX_DAILY:-25}
      # AI (DeepSeek) nhận diện khách từ chối (D19). MẶC ĐỊNH TẮT; cần cả ba cờ: APP_AI_ENABLED, APP_ZALO_INBOX_ENABLED và BRIDGE_INBOX_ENABLED ở bộ nối.
      # Khóa API chỉ đặt trong file .env trên máy chủ (không vào repo, log hay PR); tên mô hình do chủ shop đặt.
      APP_AI_ENABLED: ${APP_AI_ENABLED:-false}
      APP_AI_API_KEY: ${APP_AI_API_KEY:-}
      APP_AI_MODEL: ${APP_AI_MODEL:-}
      APP_AI_DAILY_LIMIT: ${APP_AI_DAILY_LIMIT:-1000}
      APP_ZALO_INBOX_ENABLED: ${APP_ZALO_INBOX_ENABLED:-false}
      APP_ZALO_INBOX_THRESHOLD: ${APP_ZALO_INBOX_THRESHOLD:-0.8}
      # Trần Java thấp hơn bản mặc định (512m) vì máy dùng chung; ghi đè được bằng ADH_JAVA_OPTS.
      JAVA_TOOL_OPTIONS: ${ADH_JAVA_OPTS:--Xms96m -Xmx320m -XX:+ExitOnOutOfMemoryError}
    ports:
      - "127.0.0.1:${ADH_HOST_PORT:-8081}:8080"
    networks: [internal, zalo]
    mem_limit: 512m

  # Cầu nối Zalo không chính thức (D16, docs/ADR-0002). MẶC ĐỊNH KHÔNG KHỞI ĐỘNG: chỉ chạy khi bật profile "zalo-auto"
  # (đặt COMPOSE_PROFILES=zalo-auto trong .env). Không công bố cổng; chỉ ứng dụng (cùng mạng "zalo") gọi được.
  zalo-bridge:
    profiles: ["zalo-auto"]
    # Ảnh dựng sẵn bởi GitHub Actions (cùng thẻ với ứng dụng), không build trên máy chủ nhỏ. deploy.sh kéo ảnh này khi bật profile.
    image: ghcr.io/nexagnet/adh-zalo-bridge:${ADH_TAG:-chua-dat}
    restart: unless-stopped
    environment:
      BRIDGE_KEY: ${APP_ZALO_BRIDGE_KEY:-}
      # Khóa AES-256 mã hóa phiên Zalo (64 ký tự hex). TÁCH khỏi sao lưu: sao lưu chỉ có cơ sở dữ liệu, không có file .env này.
      SESSION_KEY: ${ZALO_SESSION_KEY:-}
      # Mã Zalo của TÀI KHOẢN PHỤ. Đăng nhập bằng tài khoản khác sẽ bị từ chối và đăng xuất.
      ZALO_ACCOUNT_ID: ${ZALO_ACCOUNT_ID:-}
      APP_ZALO_AUTO_MAX_DAILY: ${APP_ZALO_AUTO_MAX_DAILY:-100}
      BRIDGE_PERSON_ERROR_CODES: ${ZALO_PERSON_ERROR_CODES:-}
      # Tự gửi tin (D18): trần cứng và khoảng cách tối thiểu ở bộ nối (cao hơn trần của ứng dụng, là lớp bảo hiểm thứ hai).
      BRIDGE_MSG_DAILY: ${BRIDGE_MSG_DAILY:-150}
      BRIDGE_MSG_GAP_SEC: ${BRIDGE_MSG_GAP_SEC:-90}
      # Đọc tin riêng của người đã nhận tin hệ thống, chỉ để nhận diện từ chối (D19). MẶC ĐỊNH TẮT; tin chỉ nằm trong bộ nhớ.
      BRIDGE_INBOX_ENABLED: ${BRIDGE_INBOX_ENABLED:-false}
      # Máy dùng chung chỉ có 2 GB: giới hạn vùng nhớ của Node để bộ nối không phình ra.
      NODE_OPTIONS: --max-old-space-size=80
    volumes:
      - zalo-bridge-data:/data
    networks: [zalo]
    mem_limit: 160m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  zalo-bridge-data:

networks:
  internal:
  # Chỉ ứng dụng và cầu nối Zalo; cầu nối cần ra Internet để nói chuyện với Zalo nhưng không công bố cổng nào.
  zalo:
