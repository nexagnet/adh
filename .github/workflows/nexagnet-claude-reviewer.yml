name: Nexagnet Reviewer caller

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  review:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.pull_requests[0] != null
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: write
    uses: nexagnet/.github/.github/workflows/claude-reviewer.yml@3830e26333771c6c0895b59b88fe2b62e24907a8
    with:
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      expected_head_sha: ${{ github.event.workflow_run.head_sha }}
      ci_run_id: ${{ github.event.workflow_run.id }}
      required_jobs_csv: test,lint
      trusted_authors_csv: phungtienviet14-sketch
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
