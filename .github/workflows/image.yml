name: image

# Build ảnh Docker của ứng dụng và của cầu nối Zalo (zalo-bridge) trên GitHub rồi đẩy lên ghcr.io; máy chủ chỉ kéo về chạy
# (không build Java/Node trên máy chủ 2 GB). Ảnh cầu nối chỉ được dựng sẵn, KHÔNG tự chạy: cầu nối vẫn tắt mặc định,
# chỉ chạy khi bật profile "zalo-auto" trong compose.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: adh-app
            context: app
          - name: adh-zalo-bridge
            context: zalo-bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.name == 'adh-app' && format('BUILD_REVISION={0}', github.sha) || '' }}
          # Gắn thẻ theo mã commit đầy đủ (deploy.sh dùng đúng thẻ này) và "latest" để tiện xem.
          tags: |
            ghcr.io/nexagnet/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/nexagnet/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
