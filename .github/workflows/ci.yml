name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Build and test with embedded PostgreSQL
        working-directory: app
        run: ./mvnw --batch-mode --no-transfer-progress verify

  # Dịch vụ cầu nối Zalo (D16): test lõi, hợp đồng HTTP, khóa "không có đường gửi tin/kết bạn". Không nối Zalo thật.
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Show Node version
        run: node --version
      - name: Install exactly the locked dependencies (no install scripts)
        working-directory: zalo-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        working-directory: zalo-bridge
        run: npm test
      - name: Audit production dependencies (informational)
        working-directory: zalo-bridge
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Reject local data and configuration in Git
        shell: bash
        run: |
          forbidden=$(git ls-files -- data_product/ app/target/ \
            ':(icase)*.xls' ':(icase)*.xlsx' ':(icase)*.xlsm' ':(icase)*.xlsb' \
            ':(glob)**/.env' ':(glob)**/.env.*' ':(exclude,glob)**/.env.example')
          if [[ -n "$forbidden" ]]; then
            echo '::error::Remove tracked customer data, build output, or local environment files.'
            exit 1
          fi
      - name: Check deploy scripts (syntax, shellcheck, offline tests)
        shell: bash
        run: |
          for f in infra/*.sh; do bash -n "$f"; done
          shellcheck -S warning infra/*.sh
          bash infra/test-auto-deploy.sh
          bash infra/test-deploy.sh
          bash infra/test-backup.sh
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
