spring:
  application:
    name: crm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB   # tổng các file tải lên cùng lúc (nhập nhiều file J&T)
  thymeleaf:
    cache: true

server:
  # Chạy sau reverse proxy (Caddy): lấy địa chỉ khách thật từ X-Forwarded-For (Tomcat chỉ tin proxy trong mạng nội bộ).
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    # Bắt buộc đặt qua biến môi trường APP_ADMIN_PASSWORD; ứng dụng không khởi động nếu để trống.
    password: ${APP_ADMIN_PASSWORD:}
  imports:
    max-rows: 50000
    max-uncompressed-bytes: 104857600
    # Nhắc trên Tổng quan khi một hãng đã nhập file mà quá chừng này ngày chưa có file mới (thay cho tự động hóa).
    remind-days: 7
    # File xuất lần tới lùi lại chừng này ngày so với đơn mới nhất đã nhập (trạng thái đơn đổi sau khi tạo). Đề xuất, chưa đo thực tế.
    overlap-days: 14
    # Đơn chưa có kết quả cuối chỉ kéo mốc xuất lùi tối đa chừng này ngày (đơn "Đã lấy hàng" từ nhiều tháng trước không kéo mãi).
    lookback-days: 30
  # Địa chỉ công khai của ứng dụng, dùng để ghép link mời /i/<token>. Đặt APP_PUBLIC_BASE_URL khi chạy thật.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  shop-name: ${APP_SHOP_NAME:Cửa hàng}
  # Số điện thoại cửa hàng hiển thị trên trang khách bấm link (có thể để trống).
  shop-phone: ${APP_SHOP_PHONE:}
  entry:
    # Giấy in bỏ vào gói hàng dùng MỘT mã QR chung (/moi). Mỗi địa chỉ mạng chỉ được tạo tối đa chừng này lượt MỚI mỗi giờ.
    max-new-per-ip-per-hour: 20
  ai:
    # AI (DeepSeek, giao thức giống OpenAI). MẶC ĐỊNH TẮT. Chỉ nhận văn bản đã che số điện thoại/email; không bao giờ gửi
    # số điện thoại, địa chỉ, mã Zalo hay tên khách. Khóa API chỉ qua biến môi trường, không vào repo hay log.
    enabled: ${APP_AI_ENABLED:false}
    api-key: ${APP_AI_API_KEY:}
    # Tên mô hình do chủ shop đặt (không đoán mặc định).
    model: ${APP_AI_MODEL:}
    base-url: ${APP_AI_BASE_URL:https://api.deepseek.com}
    # Trần lượt gọi mỗi ngày; hết thì AI im lặng và việc chuyển mẹ.
    daily-limit: ${APP_AI_DAILY_LIMIT:1000}
    # D21: AI đề xuất chiến dịch (chỉ đề xuất, người duyệt). MẶC ĐỊNH TẮT; cần cả enabled ở trên. Số lần bấm "Nhờ AI đề xuất" tối đa mỗi ngày.
    advisor-enabled: ${APP_AI_ADVISOR_ENABLED:false}
    advisor-max-runs-per-day: ${APP_AI_ADVISOR_MAX_RUNS:5}
  grouping:
    # Cho phép xếp khách vào nhóm của miền khác khi không còn nhóm nào hợp (mặc định không).
    allow-other-region: false
    # Trần mềm của nhóm (24/11/2026): nhóm được nhận thêm tới "mục tiêu + số này" KHÁCH khi có khách đồng ý trễ hoặc khách dư lẻ không đủ lập nhóm mới.
    # Số khách không tính tài khoản phụ và mẹ phó nhóm. 0 = không vượt mục tiêu.
    soft-overflow: 3
  map:
    # Nền bản đồ: ô bản đồ công cộng của OpenStreetMap (miễn phí, không cần khóa, dành cho lượng dùng nhỏ như trang quản trị này).
    # Muốn đổi sang máy chủ ô bản đồ khác (tự dựng hoặc dịch vụ có gói miễn phí) thì đặt APP_MAP_TILE_URL và app.map.tile-attribution.
    tile-url: ${APP_MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
  weather:
    # Dự báo thời tiết theo tỉnh để nhắc việc cho mẹ (nguồn MET Norway, CC BY 4.0). MẶC ĐỊNH TẮT; bật bằng biến môi trường.
    # Chỉ gửi ra ngoài tọa độ thành phố tỉnh lỵ, không bao giờ gửi dữ liệu khách. Không tự nhắn khách.
    enabled: ${APP_WEATHER_ENABLED:false}
    # Tên ứng dụng gửi cho MET Norway (họ yêu cầu có định danh). Có thể thêm tên miền của cửa hàng nếu muốn.
    user-agent: ${APP_WEATHER_USER_AGENT:adh-shop-crm/1.0}
    refresh-hours: 3
    # Hỏi thời tiết cả 63 tỉnh (không chỉ tỉnh đang có khách) để lớp thời tiết trên bản đồ có đủ cả nước. Chỉ gửi tọa độ tỉnh lỵ.
    all-provinces: true
    # Ngưỡng nhắc việc: nhiệt độ thấp nhất trong 48 giờ tới (lạnh) và cao nhất (nóng), theo từng miền.
    cold-bac: 13
    cold-trung: 16
    cold-nam: 22
    hot: 37
    alert-min-customers: 10
  friend-flow:
    # Luồng kết bạn -> vào nhóm (D15). Tất cả là giả định, chỉnh được; chỉ nhắc trên web, hệ thống không nhắn khách.
    # Giữ chỗ nhóm cho khách vừa kết bạn bao nhiêu giờ (hết hạn thì gợi ý lại từ đầu).
    reserve-hours: 24
    # Khách đã kết bạn quá bấy nhiêu ngày mà chưa vào nhóm thì hiện nhãn "quá hạn thêm vào nhóm".
    overdue-days: 2
    # Đã nhắn quá bấy nhiêu ngày mà chưa kết bạn thì hiện nhãn "không phản hồi" (không nhắn lại).
    no-reply-days: 14
  invitations:
    # Mỗi lô mời tối đa bao nhiêu khách (gửi chậm, theo lô nhỏ).
    max-batch: 20
    # Một chiến dịch theo khu vực có thể gồm nhiều khách hơn một lô; mỗi ngày chỉ nhắn theo hạn mức ngày/giờ (mục Lô nhắn hôm nay).
    max-campaign: 300
    # Tỷ lệ giả định khách bấm rồi vào nhóm, CHỈ dùng để chia nhóm; không phải số người thật.
    assumed-accept-rate: 0.5
  sending:
    # Gửi thật qua dịch vụ bên ngoài. MẶC ĐỊNH TẮT; chỉ chủ cửa hàng bật bằng biến môi trường.
    # Đường gửi hiện dùng: Zalo, mẹ gửi tay từ danh sách xuất ra (không qua cờ này). SMS/ZBS chưa dùng, chưa có bộ gửi,
    # nên bật cờ này cũng chưa gửi được gì qua dịch vụ ngoài.
    enabled: ${APP_SENDING_ENABLED:false}
    window-start: "07:00"
    window-end: "22:00"
    daily-limit: ${APP_SENDING_DAILY_LIMIT:20}
    # Tối đa bao nhiêu tin trong 60 phút gần nhất; 0 = không giới hạn theo giờ.
    hourly-limit: ${APP_SENDING_HOURLY_LIMIT:6}
    # Nhịp gợi ý khi nhắn tay: hai tin cách nhau ít nhất bấy nhiêu phút (chỉ hiển thị, không ép buộc).
    suggested-gap-minutes: 3
    # Khoảng nghỉ CỐ ĐỊNH giữa hai tin khi gửi từng tin một (không ngẫu nhiên hóa).
    gap-seconds: 120
    scheduler-enabled: false
    monthly-budget-vnd: 1000000
    stop-after-consecutive-failures: 3
    stop-failure-rate: 0.3
    stop-opt-out-rate: 0.05
  zalo:
    auto:
      # Bộ nối Zalo không chính thức (D16, docs/ADR-0002). MẶC ĐỊNH TẮT. Muốn bật cần CẢ HAI: biến môi trường này VÀ chọn nấc ở
      # trang quản trị "Zalo tài khoản phụ". Chạy cùng profile Docker "zalo-auto" (dịch vụ zalo-bridge).
      enabled: ${APP_ZALO_AUTO_ENABLED:false}
      bridge-url: ${APP_ZALO_BRIDGE_URL:http://zalo-bridge:3100}
      # Khóa chung giữa Adh và dịch vụ cầu nối (bắt buộc khi bật; ứng dụng không khởi động nếu để trống).
      bridge-key: ${APP_ZALO_BRIDGE_KEY:}
      # Trần cứng của số người thêm mỗi ngày; trang quản trị chỉ chỉnh được đến mức này. Mặc định 50/ngày, 5/giờ, cách nhau 2 phút.
      max-daily: ${APP_ZALO_AUTO_MAX_DAILY:100}
      # D18: trần cứng số KHÁCH được nhắn chủ động (Tin 1) mỗi ngày; trang quản trị chỉ chỉnh được đến mức này (chủ shop chốt 23/11/2026: 50).
      msg-max-daily: ${APP_ZALO_AUTO_MSG_MAX_DAILY:50}
    safety:
      # Chế độ thử (mặc định): chỉ liên hệ các số thử khai báo ở trang Zalo; khách thật không bao giờ bị chạm kể cả khi công tắc tự gửi bật.
      # true = chạy thật (không hạn chế). Chỉ đặt bằng biến môi trường trên máy chủ, không có nút trên giao diện.
      live: ${APP_ZALO_LIVE:false}
    group:
      # D19: tự tạo nhóm Zalo theo khu vực. Mã Zalo (chữ số) của mẹ để thêm làm phó nhóm: CHỈ đặt bằng biến môi trường trên máy chủ,
      # không ghi vào repo. Để trống = không thêm phó nhóm. Mặc định tắt: cần cả APP_ZALO_AUTO_ENABLED và nấc chọn ở trang Zalo.
      deputy-id: ${APP_ZALO_GROUP_DEPUTY_ID:}
  alert:
    # Kênh báo ngoài (tùy chọn) khi tài khoản Zalo phụ có dấu hiệu bị hạn chế: địa chỉ https nhận văn bản thuần (POST). Để trống = không báo ra ngoài,
    # cảnh báo vẫn hiện trên trang quản trị. Chỉ đặt bằng biến môi trường (địa chỉ có thể chứa khóa), không ghi vào repo.
    webhook-url: ${APP_ALERT_WEBHOOK_URL:}
  bot:
    # Mẹ vừa trả lời trong nhóm thì bot im lặng bao nhiêu phút (tránh trả lời trùng).
    human-quiet-minutes: 30
    max-replies-per-5-min: 3
  security:
    # Sai quá số lần này liên tiếp thì khóa cặp (IP, tên đăng nhập) trong lock-minutes phút.
    max-login-failures: 5
    lock-minutes: 15
