<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Chăm sóc khách'">Chăm sóc khách</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<nav th:fragment="nav" class="nav" aria-label="Menu chính">
    <a class="brand" th:href="@{/}">Chăm sóc khách</a>
    <div class="nav-group" th:each="g : ${@navMenu.groups(navKey)}">
        <div class="nav-title" th:text="${g.title}">Khách hàng</div>
        <a th:each="i : ${g.items}" th:href="@{${i.url}}" th:classappend="${i.active} ? 'active'">
            <span th:text="${i.label}">Tổng quan</span>
            <span class="count" th:if="${i.hasBadge()}" th:text="${i.badge}">3</span>
        </a>
    </div>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Đăng xuất</button>
    </form>
</nav>
</body>
</html>
