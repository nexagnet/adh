<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${shopName}">Cửa hàng</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body class="landing">
<div class="shopbar" th:text="${shopName}">Cửa hàng</div>
<main>
    <h1 th:if="${tooMany}">Anh/chị thao tác hơi nhiều lần</h1>
    <p th:if="${tooMany}">Vui lòng đợi một lúc rồi thử lại.</p>
    <h1 th:if="${noGroup}">Các nhóm hiện đã đủ người</h1>
    <p th:if="${noGroup}">Cửa hàng sẽ mở thêm nhóm. Anh/chị cần hỗ trợ thì cứ gọi điện cho cửa hàng.</p>
    <h1 th:unless="${noGroup == true or tooMany == true}">Link này đã hết hạn</h1>
    <p th:unless="${noGroup == true or tooMany == true}">Anh/chị vui lòng gọi điện cho cửa hàng, cửa hàng sẽ hướng dẫn anh/chị.</p>
    <a class="btn" th:if="${!shopPhone.isEmpty()}" th:href="@{|tel:${shopPhone}|}">Gọi cửa hàng: <span th:text="${shopPhone}">09xx xxx xxx</span></a>
</main>
</body>
</html>
