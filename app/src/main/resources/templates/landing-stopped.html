<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${shopName}">Cửa hàng</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body class="landing">
<main>
    <h1 th:if="${stopped}">Đã ghi nhận</h1>
    <p th:if="${stopped}"><span th:text="${shopName}">Cửa hàng</span> sẽ không nhắn mời bạn nữa. Cảm ơn bạn.</p>
    <h1 th:unless="${stopped}">Link này không còn dùng được</h1>
    <p th:if="${!shopPhone.isEmpty()}">Nếu cần, bạn gọi cửa hàng: <strong th:text="${shopPhone}">0900000000</strong></p>
</main>
</body>
</html>
