<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${shopName}">Cửa hàng</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body class="landing">
<div class="shopbar" th:text="${shopName}">Cửa hàng</div>
<main>
    <h1 th:if="${stopped}">Cửa hàng đã ghi nhận</h1>
    <p th:if="${stopped}">Cửa hàng sẽ không nhắn tin cho anh/chị nữa. Anh/chị vẫn gọi điện cho cửa hàng như bình thường.</p>
    <h1 th:unless="${stopped}">Link này đã hết hạn</h1>
    <p th:unless="${stopped}">Anh/chị vui lòng gọi điện cho cửa hàng, cửa hàng sẽ hướng dẫn anh/chị.</p>
    <a class="btn" th:if="${!shopPhone.isEmpty()}" th:href="@{|tel:${shopPhone}|}">Gọi cửa hàng: <span th:text="${shopPhone}">09xx xxx xxx</span></a>
</main>
</body>
</html>
